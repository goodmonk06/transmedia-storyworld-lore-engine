version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: lore-engine-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: lore_user
      POSTGRES_PASSWORD: lore_password
      POSTGRES_DB: lore_engine_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lore_user -d lore_engine_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lore-engine-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
  redis_dev_data:
